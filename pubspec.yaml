name: publish_unity_hot_assets
description: "A new Flutter project."
publish_to: "none"
version: 3.3.2

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  get: ^4.7.2
  encrypt: ^5.0.1
  pointycastle: ^3.7.3
  dio: ^5.8.0+1
  asn1lib: ^1.6.5
  flutter_smart_dialog: ^4.9.8+8
  darty_json_safe: ^1.0.3
  archive: ^4.0.7
  path_provider: ^2.1.5
  path: ^1.9.0
  xml2json: ^6.2.6
  crypto: ^3.0.3 # 添加加密库依赖
  quickalert: ^1.1.0
  shared_preferences: ^2.5.3
  flutter_archive: ^6.0.3
  package_info_plus: ^8.1.1
  # 13.1.1 要求 Target.expired 为 bool；自建 Appwrite 常返回 null，导致 account.get() 崩溃
  appwrite: 13.0.0
  file_selector: ^1.1.0
  desktop_webview_window: ^0.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow/Barlow-Bold.ttf
